# Build the download and attach it to the GitHub Release for the tag.
# The asset names must stay stable: README links to releases/latest/download/PuriCat-mac.dmg,
# and installed apps ask releases/latest/download/latest.json for the next version
# (docs/adr/0020-in-app-updates.md).
# Run by hand (workflow_dispatch), or open a PR that changes this file, to build
# without publishing; the file is then only kept as a workflow artifact.
#
# macOS only for now: PuriCat has not been built or tested on Windows or Linux.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Signing and notarization are optional: without the secrets (fork PRs, or
      # before they are added) the app is only ad-hoc signed, which keeps the
      # bundle's seal valid but does not satisfy Gatekeeper (README, "Install").
      # Only non-empty values reach Tauri, which would otherwise try to use them.
      - name: Set up signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No signing secrets; building an ad-hoc signed app."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          # Own keychain (Tauri's temporary one is gone after the build, and the
          # DMG is signed after that).
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 -A -T /usr/bin/codesign \
            -P "$APPLE_CERTIFICATE_PASSWORD"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "DEVELOPER_ID_SIGNED=1" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            { echo "APPLE_ID=$APPLE_ID"; echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::warning::No notarization secrets; the app is signed but not notarized."
          fi
      # The package an installed app updates itself from is signed with a key of its own
      # (not Apple's): the app installs nothing that this key did not sign. Without the key
      # (fork PRs) the build has no such package; a release must have one, or the apps
      # already installed would never be offered it.
      - name: Build universal app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app's version is $version."
            exit 1
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::No update signing key (TAURI_SIGNING_PRIVATE_KEY): a release needs the update package."
            exit 1
          else
            echo "::warning::No update signing key; building without the update package."
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            pnpm tauri build --target universal-apple-darwin
          fi
      - name: Collect
        run: |
          mkdir -p out
          bundle=target/universal-apple-darwin/release/bundle
          cp $bundle/dmg/*.dmg out/PuriCat-mac.dmg
          codesign --verify --deep --strict --verbose=2 $bundle/macos/PuriCat.app
          lipo -archs $bundle/macos/PuriCat.app/Contents/MacOS/puricat
          # The update package, its signature, and the manifest that names them. One
          # package serves both architectures: the app is universal.
          if [ -f $bundle/macos/PuriCat.app.tar.gz.sig ]; then
            cp $bundle/macos/PuriCat.app.tar.gz out/PuriCat-mac.app.tar.gz
            cp $bundle/macos/PuriCat.app.tar.gz.sig out/PuriCat-mac.app.tar.gz.sig
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            node -e '
              const fs = require("fs");
              const [version, repository] = process.argv.slice(1);
              const entry = {
                signature: fs.readFileSync("out/PuriCat-mac.app.tar.gz.sig", "utf8"),
                url: `https://github.com/${repository}/releases/download/v${version}/PuriCat-mac.app.tar.gz`,
              };
              const manifest = { version, pub_date: new Date().toISOString(), platforms: { "darwin-aarch64": entry, "darwin-x86_64": entry } };
              fs.writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2) + "\n");
            ' "$version" "$GITHUB_REPOSITORY"
            cat out/latest.json
          fi
      # Tauri notarizes and staples the .app; the DMG around it gets its own
      # signature and ticket so Gatekeeper accepts the download itself.
      - name: Sign, notarize and check DMG
        if: env.DEVELOPER_ID_SIGNED == '1'
        run: |
          dmg=out/PuriCat-mac.dmg
          app=target/universal-apple-darwin/release/bundle/macos/PuriCat.app
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          xcrun stapler validate "$app"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t install "$dmg"
      # What an update puts in place of the installed app must be the same signed and
      # notarized app as the one in the DMG, not a copy made before those steps.
      - name: Check the update package
        if: hashFiles('out/PuriCat-mac.app.tar.gz') != ''
        run: |
          mkdir -p "$RUNNER_TEMP/update" && tar -xzf out/PuriCat-mac.app.tar.gz -C "$RUNNER_TEMP/update"
          app="$RUNNER_TEMP/update/PuriCat.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/puricat"
          if [ "$DEVELOPER_ID_SIGNED" = 1 ] && [ -n "$APPLE_ID" ]; then
            xcrun stapler validate "$app"
            spctl -a -vv "$app"
          fi
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  publish:
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum PuriCat-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The manifest goes up last: an app that reads it must find the package already there.
      - name: Create or update release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PuriCat-* SHA256SUMS.txt --clobber
            gh release upload "$TAG" latest.json --clobber
          else
            # A tag with a suffix (v0.2.0-rc1) becomes a pre-release, so it
            # never takes over the releases/latest download link.
            pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
            gh release create "$TAG" PuriCat-* SHA256SUMS.txt --title "PuriCat ${TAG#v}" --generate-notes $pre
            gh release upload "$TAG" latest.json
          fi
